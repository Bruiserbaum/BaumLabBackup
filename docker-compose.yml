version: "3.9"

services:
  baumlabbackup:
    build: ./app
    ports:
      - "${WEB_PORT:-8765}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - baumlabbackup_data:/data
      - /tmp/baumlabbackup:/tmp/baumlabbackup
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - TZ=${TZ:-America/New_York}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

volumes:
  baumlabbackup_data:
